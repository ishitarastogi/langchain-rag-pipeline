[project]
name = "langchain-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ishitarastogi", email = "ishita3099@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "typesense>=2.0.0",
]

[project.scripts]
langchain-rag-pipeline = "langchain_rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
